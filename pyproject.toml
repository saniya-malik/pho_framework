[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pho-framework"
version = "0.1.0"
description = "Parallel Hyperparameter Optimization Framework"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-learn",
    "matplotlib"
]

[project.scripts]
pho = "src.pho.cli:main"

[tool.setuptools.packages.find]
where = ["."]